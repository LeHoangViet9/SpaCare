services:
  mongo:
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports: ["127.0.0.1:27018:27017"]
    volumes: ["spacare_mongo:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
  mongo-init:
    image: mongo:8.0
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint: ["mongosh", "--host", "mongo:27017", "--quiet", "--eval", "try { const status = rs.status(); if (status.set !== 'rs0') throw new Error('Expected replica set rs0'); } catch (e) { if (e.code !== 94) throw e; const result = rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}); if (result.ok !== 1) throw new Error('Cannot initialize rs0'); }"]
volumes:
  spacare_mongo:
